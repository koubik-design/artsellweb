<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan Commissions & Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<div class="app-container">
    <div class="top-bar">
        <select id="lang-select">
            <option value="cz">🇨🇿 CZ</option>
            <option value="en">🇬🇧 EN</option>
            <option value="de">🇩🇪 DE</option>
        </select>
        <button id="admin-toggle-btn" class="secondary-btn" data-i18n="adminLogin">Admin Login</button>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="admin-panel hidden">
        <h3 data-i18n="adminTitle">Admin Access</h3>
        <div id="admin-login-form">
            <input type="email" id="admin-email" placeholder="Email">
            <input type="password" id="admin-password" placeholder="Heslo / Password">
            <button id="login-submit-btn" data-i18n="login">Přihlásit se</button>
        </div>
        <div id="admin-controls" class="hidden">
            <p><span data-i18n="loggedInAs">Přihlášen jako:</span> <strong id="admin-user-email"></strong></p>
            
            <!-- Add Product Form with File Upload -->
            <div class="add-product-box">
                <h4 data-i18n="addNewProduct">Přidat nový produkt</h4>
                <input type="text" id="new-title" placeholder="Název / Title">
                <input type="text" id="new-desc" placeholder="Popis / Description">
                <input type="number" id="new-price" placeholder="Cena v CZK / Price in CZK">
                <input type="text" id="new-stripe-id" placeholder="Stripe Price ID (price_...)">
                <label style="font-size: 0.8rem;">Fotografie / Image:</label>
                <input type="file" id="new-image" accept="image/*">
                <button id="add-product-btn" data-i18n="saveProduct">Uložit produkt</button>
            </div>

            <button id="logout-btn" class="danger-btn" data-i18n="logout">Odhlásit se</button>
        </div>
    </div>

    <header>
        <h1>Custom Artworks</h1>
        <p class="subtitle" data-i18n="subtitle">Originální díla a zakázková tvorba</p>
    </header>

    <!-- Product Showcase -->
    <section>
        <h2 data-i18n="availableWorks">Dostupná díla</h2>
        <div class="product-grid" id="product-list"></div>
    </section>

    <!-- Admin Commissions View -->
    <section id="admin-commissions-section" class="hidden">
        <h2>Poptávky / Commissions</h2>
        <div class="commission-grid" id="commission-list"></div>
    </section>

    <!-- Custom Commission Form -->
    <section>
        <h2 data-i18n="commissionTitle">Zakázková tvorba</h2>
        <form id="commission-form">
            <div class="form-group">
                <label for="name" data-i18n="name">Jméno</label>
                <input type="text" id="name" required placeholder="Jan Novák">
            </div>
            <div class="form-group">
                <label for="email" data-i18n="email">E-mail</label>
                <input type="email" id="email" required placeholder="jan@example.cz">
            </div>
            <div class="form-group">
                <label for="description" data-i18n="conceptDesc">Popis konceptu</label>
                <textarea id="description" rows="3" required placeholder="Popište svou představu..."></textarea>
            </div>
            <div class="form-group slider-container">
                <label data-i18n="budgetEstimate">Odhad rozpočtu</label>
                <input type="range" id="price" min="20" max="250" value="100" step="5">
                <span class="price-badge" id="price-output">100 Kč</span>
            </div>
            <button type="submit" data-i18n="submitRequest">Odeslat poptávku</button>
        </form>
    </section>
</div>

<!-- Full-Screen Lightbox Modal -->
<div id="lightbox" class="lightbox hidden">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Enlarged Art">
</div>

<script type="module" src="app.js"></script>
</body>
</html>
