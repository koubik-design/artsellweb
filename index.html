<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan Commissions & Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Stripe JS SDK -->
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Custom Artworks</h1>
        <p class="subtitle">Original pieces & custom commissions</p>
    </header>

    <!-- Product Showcase -->
    <section>
        <h2>Available Works</h2>
        <div class="product-grid" id="product-list">
            <!-- Dynamically populated from Firestore -->
        </div>
    </section>

    <!-- Custom Commission Request -->
    <section>
        <h2>Commission Request</h2>
        <form id="commission-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Jane Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="jane@example.com">
            </div>
            <div class="form-group">
                <label for="description">Concept Description</label>
                <textarea id="description" rows="3" required placeholder="Describe your vision..."></textarea>
            </div>
            <div class="form-group slider-container">
                <label>Budget Estimate</label>
                <input type="range" id="price" min="50" max="500" value="250" step="10">
                <span class="price-badge" id="price-output">$250</span>
            </div>
            <button type="submit">Submit Request</button>
        </form>
    </section>
</div>

<!-- Main Application Script -->
<script type="module" src="app.js"></script>

</body>
</html>
